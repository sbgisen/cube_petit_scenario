[project]
name = "memory_talk_demo"
version = "0.1.0"
description = "The memory_talk_demo package"
license = { text = "Apache-2.0" }
maintainers = [
    { name = "SoftBank corp.", email = "SBGRP-git@g.softbank.co.jp" },
]
dependencies = ["numpy<2"]

[project.scripts]
memory_talk_demo = "memory_talk_demo.memory_talk_demo.memory_talk_demo_node:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["memory_talk_demo"]
